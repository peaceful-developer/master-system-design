<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278">
  <title>Fan-out on write</title>
  <desc>When a user posts, a fan-out service copies the post into the precomputed feed of each follower, so later reads are a single lookup.</desc>
  <style>
    .box { fill: var(--fig-fill, #fff); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .soft { fill: var(--fig-fill, #fff); stroke: var(--fig-muted, #ccc); stroke-width: 2; }
    .line { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .dash { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .label { fill: var(--fig-stroke, #000); font-size: 15px; font-weight: 600; }
    .small { fill: var(--fig-stroke, #000); font-size: 12.5px; }
    .ink { fill: var(--fig-ink, #000); }
    .accent { fill: var(--fig-accent, #2bb24c); }
    .accent-box { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .packet { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 1.5; }
    .arrowhead { fill: var(--fig-stroke, #000); }
    .post { animation: post 7s linear infinite; }
    @keyframes post { 0% { transform: translate(130px, 125px); opacity: 1; } 25% { transform: translate(250px, 125px); opacity: 1; } 28% { transform: translate(250px, 125px); opacity: 0; } 100% { transform: translate(250px, 125px); opacity: 0; } }
    .f0 { animation: f0 7s linear infinite; opacity: 0; }
    @keyframes f0 { 0% { transform: translate(380px, 125px); opacity: 0; } 28% { transform: translate(380px, 125px); opacity: 0; } 30% { transform: translate(380px, 125px); opacity: 1; } 60% { transform: translate(470px, 44px); opacity: 1; } 62% { transform: translate(470px, 44px); opacity: 0; } 100% { transform: translate(470px, 44px); opacity: 0; } }
    .n0 { animation: n0 7s step-end infinite; }
    @keyframes n0 { 0% { fill: var(--fig-fill, #fff); } 62% { fill: var(--fig-accent, #2bb24c); } }
    .f1 { animation: f1 7s linear infinite; opacity: 0; }
    @keyframes f1 { 0% { transform: translate(380px, 125px); opacity: 0; } 28% { transform: translate(380px, 125px); opacity: 0; } 30% { transform: translate(380px, 125px); opacity: 1; } 65% { transform: translate(470px, 102px); opacity: 1; } 67% { transform: translate(470px, 102px); opacity: 0; } 100% { transform: translate(470px, 102px); opacity: 0; } }
    .n1 { animation: n1 7s step-end infinite; }
    @keyframes n1 { 0% { fill: var(--fig-fill, #fff); } 67% { fill: var(--fig-accent, #2bb24c); } }
    .f2 { animation: f2 7s linear infinite; opacity: 0; }
    @keyframes f2 { 0% { transform: translate(380px, 125px); opacity: 0; } 28% { transform: translate(380px, 125px); opacity: 0; } 30% { transform: translate(380px, 125px); opacity: 1; } 70% { transform: translate(470px, 160px); opacity: 1; } 72% { transform: translate(470px, 160px); opacity: 0; } 100% { transform: translate(470px, 160px); opacity: 0; } }
    .n2 { animation: n2 7s step-end infinite; }
    @keyframes n2 { 0% { fill: var(--fig-fill, #fff); } 72% { fill: var(--fig-accent, #2bb24c); } }
    .f3 { animation: f3 7s linear infinite; opacity: 0; }
    @keyframes f3 { 0% { transform: translate(380px, 125px); opacity: 0; } 28% { transform: translate(380px, 125px); opacity: 0; } 30% { transform: translate(380px, 125px); opacity: 1; } 75% { transform: translate(470px, 218px); opacity: 1; } 77% { transform: translate(470px, 218px); opacity: 0; } 100% { transform: translate(470px, 218px); opacity: 0; } }
    .n3 { animation: n3 7s step-end infinite; }
    @keyframes n3 { 0% { fill: var(--fig-fill, #fff); } 77% { fill: var(--fig-accent, #2bb24c); } }

    @media (prefers-reduced-motion: reduce) { .post, .f0, .f1, .f2, .f3 { animation: none; opacity: 0; } .n0, .n1, .n2, .n3 { animation: none; fill: var(--fig-accent, #2bb24c); } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="box" x="20" y="100" width="110" height="50" rx="10"/>
  <text class="label" x="75.0" y="130.0" text-anchor="middle">New post</text>
  <rect class="accent-box" x="250" y="95" width="130" height="60" rx="10"/>
  <text class="label ink" x="315.0" y="122.0" text-anchor="middle">Fan-out</text>
  <text class="small ink" x="315.0" y="140.0" text-anchor="middle">service</text>
  <line class="line" x1="130" y1="125" x2="248" y2="125" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="24" width="150" height="40" rx="8"/>
  <rect class="box n0" x="478" y="32" width="24" height="24" rx="4"/>
  <text class="small" x="512" y="49" text-anchor="start">Follower 1 feed</text>
  <line class="line" x1="380" y1="125" x2="468" y2="44" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="82" width="150" height="40" rx="8"/>
  <rect class="box n1" x="478" y="90" width="24" height="24" rx="4"/>
  <text class="small" x="512" y="107" text-anchor="start">Follower 2 feed</text>
  <line class="line" x1="380" y1="125" x2="468" y2="102" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="140" width="150" height="40" rx="8"/>
  <rect class="box n2" x="478" y="148" width="24" height="24" rx="4"/>
  <text class="small" x="512" y="165" text-anchor="start">Follower 3 feed</text>
  <line class="line" x1="380" y1="125" x2="468" y2="160" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="198" width="150" height="40" rx="8"/>
  <rect class="box n3" x="478" y="206" width="24" height="24" rx="4"/>
  <text class="small" x="512" y="223" text-anchor="start">Follower 4 feed</text>
  <line class="line" x1="380" y1="125" x2="468" y2="218" marker-end="url(#arrow)"/>
  <text class="small" x="20" y="266" text-anchor="start">Writing a copy into every follower’s feed makes reading a feed one fast lookup.</text>
  <circle class="packet post" cx="0" cy="0" r="7"/>
  <circle class="packet f0" cx="0" cy="0" r="6"/>
  <circle class="packet f1" cx="0" cy="0" r="6"/>
  <circle class="packet f2" cx="0" cy="0" r="6"/>
  <circle class="packet f3" cx="0" cy="0" r="6"/>

</svg>
