<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240">
  <title>A load balancer spreading requests</title>
  <desc>Requests from clients reach the load balancer, which sends each one to the next server in turn.</desc>
  <style>
    .box { fill: var(--fig-fill, #fff); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .soft { fill: var(--fig-fill, #fff); stroke: var(--fig-muted, #ccc); stroke-width: 2; }
    .line { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .dash { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .label { fill: var(--fig-stroke, #000); font-size: 15px; font-weight: 600; }
    .small { fill: var(--fig-stroke, #000); font-size: 12.5px; }
    .ink { fill: var(--fig-ink, #000); }
    .accent { fill: var(--fig-accent, #2bb24c); }
    .accent-box { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .packet { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 1.5; }
    .arrowhead { fill: var(--fig-stroke, #000); }
    .p0 { animation: lb0 3s linear infinite; animation-delay: 0s; opacity: 0; }
    @keyframes lb0 { 0% { transform: translate(130px, 120px); opacity: 1; } 35% { transform: translate(300px, 120px); opacity: 1; } 70% { transform: translate(470px, 43px); opacity: 1; } 75% { transform: translate(470px, 43px); opacity: 0; } 100% { transform: translate(470px, 43px); opacity: 0; } }
    .p1 { animation: lb1 3s linear infinite; animation-delay: 1s; opacity: 0; }
    @keyframes lb1 { 0% { transform: translate(130px, 120px); opacity: 1; } 35% { transform: translate(300px, 120px); opacity: 1; } 70% { transform: translate(470px, 118px); opacity: 1; } 75% { transform: translate(470px, 118px); opacity: 0; } 100% { transform: translate(470px, 118px); opacity: 0; } }
    .p2 { animation: lb2 3s linear infinite; animation-delay: 2s; opacity: 0; }
    @keyframes lb2 { 0% { transform: translate(130px, 120px); opacity: 1; } 35% { transform: translate(300px, 120px); opacity: 1; } 70% { transform: translate(470px, 193px); opacity: 1; } 75% { transform: translate(470px, 193px); opacity: 0; } 100% { transform: translate(470px, 193px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { .p0, .p1, .p2 { animation: none; opacity: 0; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="box" x="20" y="95" width="110" height="50" rx="10"/>
  <text class="label" x="75.0" y="125.0" text-anchor="middle">Clients</text>
  <rect class="accent-box" x="240" y="95" width="120" height="50" rx="25"/>
  <text class="label ink" x="300.0" y="117.0" text-anchor="middle">Load</text>
  <text class="small ink" x="300.0" y="135.0" text-anchor="middle">balancer</text>
  <line class="line" x1="130" y1="120" x2="238" y2="120" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="20" width="150" height="46" rx="10"/>
  <text class="label" x="545.0" y="48.0" text-anchor="middle">Server 1</text>
  <line class="line" x1="360" y1="120" x2="468" y2="43" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="95" width="150" height="46" rx="10"/>
  <text class="label" x="545.0" y="123.0" text-anchor="middle">Server 2</text>
  <line class="line" x1="360" y1="120" x2="468" y2="118" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="170" width="150" height="46" rx="10"/>
  <text class="label" x="545.0" y="198.0" text-anchor="middle">Server 3</text>
  <line class="line" x1="360" y1="120" x2="468" y2="193" marker-end="url(#arrow)"/>
  <text class="small" x="240" y="228" text-anchor="start">Round robin: request 1 → server 1, request 2 → server 2, …</text>
  <circle class="packet p0" cx="0" cy="0" r="7"/>
  <circle class="packet p1" cx="0" cy="0" r="7"/>
  <circle class="packet p2" cx="0" cy="0" r="7"/>

</svg>
