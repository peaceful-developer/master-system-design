<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312">
  <title>Latency numbers on a log scale</title>
  <desc>Approximate orders of magnitude: an L1 cache hit takes about a nanosecond, main memory about 100 ns, an SSD read about 100 microseconds, a data-centre round trip about half a millisecond, a disk seek about 10 ms and a round trip across continents about 150 ms.</desc>
  <style>
    .box { fill: var(--fig-fill, #fff); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .soft { fill: var(--fig-fill, #fff); stroke: var(--fig-muted, #ccc); stroke-width: 2; }
    .line { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .dash { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .label { fill: var(--fig-stroke, #000); font-size: 15px; font-weight: 600; }
    .small { fill: var(--fig-stroke, #000); font-size: 12.5px; }
    .ink { fill: var(--fig-ink, #000); }
    .accent { fill: var(--fig-accent, #2bb24c); }
    .accent-box { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .packet { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 1.5; }
    .arrowhead { fill: var(--fig-stroke, #000); }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 10 5 0 10z"/></marker></defs>
  <text class="label" x="20" y="38" text-anchor="start">L1 cache reference</text>
  <rect class="accent-box bar" x="250" y="24" width="8" height="20" rx="4" style="animation-delay: 0.00s"/>
  <text class="small" x="268" y="39" text-anchor="start">≈ 1 ns</text>
  <text class="label" x="20" y="82" text-anchor="start">Main memory reference</text>
  <rect class="accent-box bar" x="250" y="68" width="73" height="20" rx="4" style="animation-delay: 0.15s"/>
  <text class="small" x="333.3333333333333" y="83" text-anchor="start">≈ 100 ns</text>
  <text class="label" x="20" y="126" text-anchor="start">SSD random read</text>
  <rect class="accent-box bar" x="250" y="112" width="183" height="20" rx="4" style="animation-delay: 0.30s"/>
  <text class="small" x="443.33333333333337" y="127" text-anchor="start">≈ 100 µs</text>
  <text class="label" x="20" y="170" text-anchor="start">Round trip in a data centre</text>
  <rect class="accent-box bar" x="250" y="156" width="209" height="20" rx="4" style="animation-delay: 0.45s"/>
  <text class="small" x="468.9622334923207" y="171" text-anchor="start">≈ 0.5 ms</text>
  <text class="label" x="20" y="214" text-anchor="start">Hard disk seek</text>
  <rect class="accent-box bar" x="250" y="200" width="257" height="20" rx="4" style="animation-delay: 0.60s"/>
  <text class="small" x="516.6666666666667" y="215" text-anchor="start">≈ 10 ms</text>
  <text class="label" x="20" y="258" text-anchor="start">Round trip across continents</text>
  <rect class="accent-box bar" x="250" y="244" width="300" height="20" rx="4" style="animation-delay: 0.75s"/>
  <text class="small" x="559.7900128320416" y="259" text-anchor="start">≈ 150 ms</text>
  <line class="dash" x1="250" y1="14" x2="250" y2="282"/>
  <text class="small" x="250" y="300" text-anchor="middle">1 ns</text>
  <line class="dash" x1="360" y1="14" x2="360" y2="282"/>
  <text class="small" x="360" y="300" text-anchor="middle">1 µs</text>
  <line class="dash" x1="470" y1="14" x2="470" y2="282"/>
  <text class="small" x="470" y="300" text-anchor="middle">1 ms</text>
  <line class="dash" x1="580" y1="14" x2="580" y2="282"/>
  <text class="small" x="580" y="300" text-anchor="middle">1 s</text>
  <text class="small" x="20" y="300" text-anchor="start">Log scale: each step is 1,000×</text>

</svg>
