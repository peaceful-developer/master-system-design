<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <title>Consistent hashing ring</title>
  <desc>Four nodes and eleven keys are placed on a ring; each key belongs to the next node clockwise. Adding node E between A and B moves only the keys in that arc.</desc>
  <style>
    .box { fill: var(--fig-fill, #fff); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .soft { fill: var(--fig-fill, #fff); stroke: var(--fig-muted, #ccc); stroke-width: 2; }
    .line { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .dash { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .label { fill: var(--fig-stroke, #000); font-size: 15px; font-weight: 600; }
    .small { fill: var(--fig-stroke, #000); font-size: 12.5px; }
    .ink { fill: var(--fig-ink, #000); }
    .accent { fill: var(--fig-accent, #2bb24c); }
    .accent-box { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .packet { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 1.5; }
    .arrowhead { fill: var(--fig-stroke, #000); }
    .moved { animation: moved 6s step-end infinite; }
    @keyframes moved { 0% { fill: var(--fig-stroke, #000); } 45% { fill: var(--fig-accent, #2bb24c); } }
    .newnode { animation: appear 6s step-end infinite; }
    @keyframes appear { 0% { opacity: 0; } 40% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { .moved { animation: none; fill: var(--fig-accent, #2bb24c); } .newnode { animation: none; opacity: 1; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 10 5 0 10z"/></marker></defs>
  <circle class="line" cx="200" cy="150" r="105"/>
  <rect class="arrowhead" x="205.2" y="41.4" width="8" height="8"/>
  <rect class="arrowhead moved" x="263.5" y="65.6" width="8" height="8"/>
  <rect class="arrowhead moved" x="288.7" y="96.7" width="8" height="8"/>
  <rect class="arrowhead" x="299.4" y="127.8" width="8" height="8"/>
  <rect class="arrowhead" x="299.4" y="164.2" width="8" height="8"/>
  <rect class="arrowhead" x="248.5" y="236.9" width="8" height="8"/>
  <rect class="arrowhead" x="205.2" y="250.6" width="8" height="8"/>
  <rect class="arrowhead" x="115.6" y="213.5" width="8" height="8"/>
  <rect class="arrowhead" x="92.6" y="164.2" width="8" height="8"/>
  <rect class="arrowhead" x="128.5" y="65.6" width="8" height="8"/>
  <rect class="arrowhead" x="168.8" y="44.6" width="8" height="8"/>
  <circle class="accent-box" cx="235.9" cy="51.3" r="11"/>
  <text class="label" x="244.8" y="31.9" text-anchor="middle">A</text>
  <circle class="accent-box" cx="290.9" cy="202.5" r="11"/>
  <text class="label" x="313.4" y="220.5" text-anchor="middle">B</text>
  <circle class="accent-box" cx="164.1" cy="248.7" r="11"/>
  <text class="label" x="155.2" y="278.1" text-anchor="middle">C</text>
  <circle class="accent-box" cx="101.3" cy="114.1" r="11"/>
  <text class="label" x="76.9" y="110.2" text-anchor="middle">D</text>
  <g class="newnode"><circle class="accent-box" cx="301.4" cy="122.8" r="11"/><text class="label" x="326.5" y="121.1" text-anchor="middle">E</text></g>
  <text class="label" x="370" y="70" text-anchor="start">Nodes (circles) and keys (squares)</text>
  <text class="small" x="370" y="96" text-anchor="start">sit on the same ring. A key belongs to</text>
  <text class="small" x="370" y="116" text-anchor="start">the next node clockwise.</text>
  <text class="label" x="370" y="150" text-anchor="start">When node E joins, only the keys</text>
  <text class="small" x="370" y="176" text-anchor="start">between A and E move (highlighted).</text>
  <text class="small" x="370" y="196" text-anchor="start">Everything else stays where it was.</text>

</svg>
