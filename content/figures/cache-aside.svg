<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250">
  <title>Cache-aside: hit and miss</title>
  <desc>The application checks the cache first. On a hit it answers from memory. On a miss it reads the database and then stores the result in the cache for next time.</desc>
  <style>
    .box { fill: var(--fig-fill, #fff); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .soft { fill: var(--fig-fill, #fff); stroke: var(--fig-muted, #ccc); stroke-width: 2; }
    .line { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .dash { fill: none; stroke: var(--fig-stroke, #000); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .label { fill: var(--fig-stroke, #000); font-size: 15px; font-weight: 600; }
    .small { fill: var(--fig-stroke, #000); font-size: 12.5px; }
    .ink { fill: var(--fig-ink, #000); }
    .accent { fill: var(--fig-accent, #2bb24c); }
    .accent-box { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 2; }
    .packet { fill: var(--fig-accent, #2bb24c); stroke: var(--fig-stroke, #000); stroke-width: 1.5; }
    .arrowhead { fill: var(--fig-stroke, #000); }
    .pk { animation: ca 9s linear infinite; }
    @keyframes ca { 0% { transform: translate(170px, 120px); opacity: 1; } 12% { transform: translate(300px, 48px); opacity: 1; } 24% { transform: translate(170px, 120px); opacity: 1; } 36% { transform: translate(170px, 120px); opacity: 0; } 40% { transform: translate(170px, 120px); opacity: 1; } 50% { transform: translate(300px, 48px); opacity: 1; } 56% { transform: translate(170px, 120px); opacity: 1; } 68% { transform: translate(300px, 178px); opacity: 1; } 78% { transform: translate(170px, 120px); opacity: 1; } 90% { transform: translate(300px, 48px); opacity: 1; } 96% { transform: translate(300px, 48px); opacity: 0; } 100% { transform: translate(170px, 120px); opacity: 0; } }
    .hit { animation: hit 9s step-end infinite; } .miss { animation: miss 9s step-end infinite; }
    @keyframes hit { 0% { opacity: 1; } 38% { opacity: 0; } }
    @keyframes miss { 0% { opacity: 0; } 38% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { .pk { animation: none; opacity: 0; } .hit { animation: none; opacity: 0; } .miss { animation: none; opacity: 1; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="box" x="40" y="90" width="130" height="60" rx="10"/>
  <text class="label" x="105.0" y="125.0" text-anchor="middle">Application</text>
  <rect class="accent-box" x="300" y="20" width="150" height="56" rx="10"/>
  <text class="label ink" x="375.0" y="45.0" text-anchor="middle">Cache</text>
  <text class="small ink" x="375.0" y="63.0" text-anchor="middle">fast, in memory</text>
  <rect class="box" x="300" y="150" width="150" height="56" rx="10"/>
  <text class="label" x="375.0" y="175.0" text-anchor="middle">Database</text>
  <text class="small" x="375.0" y="193.0" text-anchor="middle">source of truth</text>
  <line class="line" x1="170" y1="110" x2="298" y2="52" marker-end="url(#arrow)"/>
  <line class="line" x1="170" y1="130" x2="298" y2="176" marker-end="url(#arrow)"/>
  <text class="small" x="480" y="46" text-anchor="start">1. Read the cache first</text>
  <text class="small" x="480" y="66" text-anchor="start">3. On a miss, fill it</text>
  <text class="small" x="480" y="180" text-anchor="start">2. On a miss, read here</text>
  <text class="label hit" x="40" y="236" text-anchor="start">Cache hit: answered from memory.</text>
  <text class="label miss" x="40" y="236" text-anchor="start">Cache miss: read the database, then store the answer in the cache.</text>
  <circle class="packet pk" cx="0" cy="0" r="7"/>

</svg>
