<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Polly is puzzled</title>
  <desc>Polly tilts her head with a question mark, as if to say: not quite, try again.</desc>
  <style>
    .ink { fill: var(--fig-ink, #000); }
    .out { stroke: var(--fig-ink, #000); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .body { fill: var(--fig-accent, #2bb24c); }
    .paper { fill: var(--fig-paper, #fff); }
    .none { fill: none; }
    .mark { fill: var(--fig-stroke, #000); font-size: 26px; font-weight: 700; }
    .on-bg { fill: var(--fig-stroke, #000); }

    .tilt { transform-box: view-box; transform-origin: 58px 60px; animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }

    @media (prefers-reduced-motion: reduce) { .tilt { animation: none; } }
  </style>
  <path class="body out" d="M50 98 L42 116 L52 111 L58 117 L60 99 Z"/><ellipse class="body out" cx="58" cy="74" rx="27" ry="31"/><ellipse class="paper out" cx="63" cy="82" rx="13.5" ry="18"/><path class="body out" d="M40 62 C29 70 29 90 43 99 C47 88 49 75 47 62 Z"/><path class="none out" d="M51 104 v7 M65 104 v7"/><g class="tilt"><g class="head" transform="rotate(10 58 40)"><path class="none out" d="M54 21 L46 9 M57 19 L57 5 M60 21 L68 10"/><circle class="body out" cx="46" cy="9" r="3.5"/><circle class="body out" cx="57" cy="5" r="3.5"/><circle class="body out" cx="68" cy="10" r="3.5"/><circle class="body out" cx="58" cy="40" r="21"/><path class="ink out" d="M77 33 C87 33 92 39 92 46 C92 50 89 53 86 54 C87 50 85 47 81 46 L77 46 Z"/><g class="eye"><circle class="paper out" cx="66" cy="36" r="6"/><circle class="ink" cx="67" cy="33.5" r="2.8"/></g></g></g><text class="mark" x="94" y="30">?</text>
</svg>
