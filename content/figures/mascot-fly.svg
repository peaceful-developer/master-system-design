<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Polly flies away</title>
  <desc>Polly flies with wings spread wide.</desc>
  <style>
    .ink { fill: var(--fig-ink, #000); }
    .out { stroke: var(--fig-ink, #000); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .body { fill: var(--fig-accent, #2bb24c); }
    .paper { fill: var(--fig-paper, #fff); }
    .none { fill: none; }
    .mark { fill: var(--fig-stroke, #000); font-size: 26px; font-weight: 700; }
    .on-bg { fill: var(--fig-stroke, #000); }

    .wing-l, .wing-r { transform-box: fill-box; animation: flap 0.6s ease-in-out infinite alternate; }
    .wing-l { transform-origin: right center; } .wing-r { transform-origin: left bottom; }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(0.55); } }

    @media (prefers-reduced-motion: reduce) { .wing-l, .wing-r { animation: none; } }
  </style>
  <g transform="rotate(-14 58 64)"><path class="body out" d="M50 98 L42 116 L52 111 L58 117 L60 99 Z"/><path class="body out wing-l" d="M44 62 C30 52 10 50 4 58 C16 64 30 70 42 74 Z"/><ellipse class="body out" cx="58" cy="74" rx="27" ry="31"/><ellipse class="paper out" cx="63" cy="82" rx="13.5" ry="18"/><path class="body out wing-r" d="M72 58 C82 42 98 32 108 34 C102 46 88 58 74 68 Z"/><g class="head"><path class="none out" d="M54 21 L46 9 M57 19 L57 5 M60 21 L68 10"/><circle class="body out" cx="46" cy="9" r="3.5"/><circle class="body out" cx="57" cy="5" r="3.5"/><circle class="body out" cx="68" cy="10" r="3.5"/><circle class="body out" cx="58" cy="40" r="21"/><path class="ink out" d="M77 33 C87 33 92 39 92 46 C92 50 89 53 86 54 C87 50 85 47 81 46 L77 46 Z"/><g class="eye"><circle class="paper out" cx="66" cy="36" r="6"/><circle class="ink" cx="67.5" cy="36" r="2.8"/></g></g></g>
</svg>
