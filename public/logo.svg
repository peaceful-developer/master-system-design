<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="System Design Lab">
  <title>System Design Lab</title>
  <!-- Crest: three connected nodes (a tiny system diagram) -->
  <path d="M27 17 L20 7 M27 17 L31 5 M27 17 L39 8" stroke="#000" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="7" r="3.5" fill="#2bb24c" stroke="#000" stroke-width="2"/>
  <circle cx="31" cy="5" r="3.5" fill="#2bb24c" stroke="#000" stroke-width="2"/>
  <circle cx="39" cy="8" r="3.5" fill="#2bb24c" stroke="#000" stroke-width="2"/>
  <!-- Head -->
  <path d="M10 38 C10 24 20 16 31 16 C41 16 47 22 48 30 L48 46 C48 54 41 59 31 59 C19 59 10 51 10 38 Z" fill="#2bb24c" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cheek -->
  <path d="M18 44 C20 51 27 54 33 53" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Hooked beak -->
  <path d="M46 27 C54 27 59 32 59 39 C59 44 56 48 52 49 C53 45 52 42 48 41 L46 41 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Eye: a node with a white ring -->
  <circle cx="35" cy="30" r="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="36.5" cy="30" r="2.5" fill="#000"/>
</svg>
